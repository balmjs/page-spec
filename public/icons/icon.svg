<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Document Card Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Accent Lens / Sparkle Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>

    <filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Document Card with Folded Corner -->
  <g filter="url(#cardShadow)">
    <!-- Document Base Body -->
    <path d="M 32 26 
             L 76 26 
             L 96 46 
             L 96 102 
             C 96 105.3 93.3 108 90 108 
             L 38 108 
             C 34.7 108 32 105.3 32 102 
             Z" 
          fill="url(#docGrad)" />

    <!-- Folded Corner Flap -->
    <path d="M 76 26 
             L 76 43 
             C 76 44.6 77.4 46 79 46 
             L 96 46 
             Z" 
          fill="#cbd5e1" />
  </g>

  <!-- Document Structured Content Lines -->
  <!-- Header title line -->
  <rect x="42" y="38" width="26" height="5" rx="2.5" fill="#4f46e5" />

  <!-- Body spec lines -->
  <rect x="42" y="52" width="44" height="4" rx="2" fill="#94a3b8" />
  <rect x="42" y="62" width="34" height="4" rx="2" fill="#cbd5e1" />
  <rect x="42" y="72" width="40" height="4" rx="2" fill="#cbd5e1" />

  <!-- Prototype / Media Box Simulation -->
  <rect x="42" y="82" width="22" height="16" rx="3" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Spec Extraction AI Sparkle / Target Lens Badge in Bottom Right -->
  <g filter="url(#accentGlow)">
    <circle cx="88" cy="88" r="18" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- Code / Spec Extractor Icon (< > or Sparkle) -->
    <path d="M 83 84 L 79 88 L 83 92 M 93 84 L 97 88 L 93 92" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <circle cx="88" cy="88" r="2" fill="#ffffff" />
  </g>
</svg>
